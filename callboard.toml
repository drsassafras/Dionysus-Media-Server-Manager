# callboard.toml — what this project's checks are held to, and where. callboard/policy.py reads it for every tool, the board, the
# UI and GitHub alike; the UI's Config tabs write it (unless [config] read_only). A rule not set here is off: nothing in
# any tool's code decides a level or a threshold.
#
# A rule is a level ("fail", "warn", "info" or "off"), a number (what missing it is: the integration's ``level``, or
# {value = 98, level = "fail"}), a toggle, or targets (a language or group to a percentage, "*" the rest).
# [<id>] holds an integration's default rules, the ones every role starts from; [<id>.<role>] what differs for that role (over the role it
# inherits from, [roles]); [<id>.diff] and [<id>.<role>.diff] what differs in diff mode (only what changed since the
# gate's base). A rule marked full-only is skipped in diff mode, and said so.

[config]
version = 1
read_only = false
# the file the code's version is read from (__version__ = "X.Y.Z"): a beta or release candidate of another version is
# stale, and puts the code in no phase
version_file = "plexcache/__init__.py"
# the package the tests' coverage is measured on, and the folder under ~/.cache where this project's tools keep what
# they fetched and saved (the check tools at their versions, the coverage the tests saved)
package = "plexcache"
cache = "plex-cache"

# ---------------------------------------------------------------- the branches, and the role each one's code has
# A branch's role decides which rules hold for its code (local work takes its branch's role). The most specific pattern
# wins; "*" is every branch not named. Roles: development, release, release-line, hotfix, feature; and the phases'
# preview, freeze, alpha. Presets: dev-main (this), github-flow (main = development, releases from tags), git-flow
# (main = release, develop = development, release/* = release-line, hotfix/* = hotfix), trunk-release-branches (main =
# development, release/* = release-line), none.
[branches]
preset = "dev-main"

[branches."main"]
role = "release"

[branches."master"]
role = "release"

[branches."dev"]
role = "development"

[branches."hotfix/*"]
role = "hotfix"

[branches."*"]
role = "feature"

# The version tags, and the phase each kind puts the code in until the version's release tag: the release process
# starts when one is pushed (no flag). A phase's role, when it's set, overrides the branch's.
[tags]
release = "v{version}"
freeze = "v{version}-rc.{n}"
preview = "v{version}-beta.{n}"
alpha = "v{version}-alpha.{n}"

[phases.preview]
role = "preview"

[phases.freeze]
role = "freeze"

# ([phases.alpha] isn't set: an alpha tag is said in the header, and changes nothing)

# What each role inherits (its rules first, then its own), and a cap (no rule above that level: a preview holds the
# release's rules, as warnings).
[roles.development]

[roles.release]

[roles.feature]
inherits = "development"

[roles.hotfix]
inherits = "release"

[roles.release-line]
inherits = "release"

[roles.preview]
inherits = "release"
cap = "warn"

[roles.freeze]
inherits = "release"

[roles.alpha]
inherits = "development"

# ---------------------------------------------------------------- the gates, and GitHub
# A gate is a run of the checks at a moment: push (the pre-push hook, and a push on GitHub), merge (a pull request),
# release (a release tag, and the release pull request). diff = true: only what changed since the gate's base (push:
# what the upstream hasn't; merge: the branch merged into; release: the last release tag). github: whether GitHub runs
# it as a check (true), reports it without blocking ("warn"), or skips it (false; a skipped required check counts as
# passed, so a gate switched off blocks nothing).
[github]
enabled = false

[gates.push]
diff = true
github = false

[gates.merge]
diff = true
github = true

[gates.release]
diff = false
github = true

# ---------------------------------------------------------------- the integrations
# Each is a block on the board and a page in the UI, in this order; one that's off (enabled = false) or not set up (no
# cmd, or a file in ``needs`` missing) is hidden everywhere but the UI's Integrations page. kind says which tool's schema
# its rules follow (tests, checks, coverage, audit, i18n, release, upkeep, style); after names the blocks it waits for.
# The letters that open each page follow the menu: the first free letter of the title (Hub and Sync first), or ``letter``.
[integrations.unit]
title = "Unit Tests"
kind = "tests"
cmd = "python3 tests/run.py --coverage --exclude WebBuildTests --exclude StyleGuideTests"

[integrations.future]
title = "Future Tests"
kind = "tests"
cmd = "python3 dev/future.py --exclude StyleGuideTests"
stop_with = ["unit"]

[integrations.dhtml]
title = "DHTML"
kind = "checks"
cmd = "python3 tests/run.py tests.test_plexcache.WebBuildTests"

[integrations.types]
title = "Python Validation"
kind = "checks"
cmd = "callboard tool typecheck"

[integrations.build]
title = "Build Validation"
kind = "checks"
cmd = "callboard tool buildcheck"

[integrations.coverage]
title = "Coverage"
kind = "coverage"
cmd = "callboard tool coverage --callboard"
after = ["unit"]

[integrations.audit]
title = "Security Audit"
kind = "audit"
cmd = "python3 dev/audit.py"
needs = ["dev/audit.toml"]

[integrations.i18n]
title = "Translations"
kind = "i18n"
cmd = "python3 dev/i18n.py --callboard"

[integrations.release]
title = "Release checks"
kind = "release"
cmd = "python3 dev/release.py --callboard"
after = ["unit"]

[integrations.upkeep]
title = "Dependencies"
kind = "upkeep"
cmd = "python3 dev/upkeep.py --callboard"

[integrations.style]
title = "Wardrobe"
kind = "style"
cmd = "python3 dev/style.py check"

# ---------------------------------------------------------------- the rules
# Unit Tests: a failed test, the warnings the run printed, the tests skipped.
[unit]
failures = "fail"
warnings = "info"
skipped = "info"

[unit.release]
warnings = "fail"

# Future Tests: the suite on the next Python — never a release's concern.
[future]
failures = "fail"
warnings = "info"
skipped = "info"

[future.release]
failures = "off"
warnings = "off"
skipped = "off"

# The checks (DHTML, Python Validation, Build Validation): what each finding's severity is.
[dhtml]
errors = "fail"
warnings = "fail"
information = "info"

[types]
errors = "fail"
warnings = "fail"
information = "info"

[build]
errors = "fail"
warnings = "fail"
information = "info"

# Coverage: what of the code the tests reach. fresh_days: a line changed within that many days (or uncommitted) is fresh;
# fresh: every fresh function or route reached; settled: % of the settled lines run; every_line and each_file: the bars
# of the whole codebase (full mode only); changed: % of the changed lines run (diff mode only).
[coverage]
level = "warn"
fresh_days = 14
fresh = "warn"
settled = 98
not_measured = "warn"

[coverage.release]
every_line = { value = 98, level = "fail" }
each_file = { value = 90, level = "fail" }

[coverage.diff]
changed = 90

# Security Audit: code no audit has seen may wait grace_days, or until it's grace_share % of the app code (unaudited);
# findings: the open findings; config: the private rules.toml's requirements; release_rules: its release rules (a full
# audit accepted, soaked, no open finding…); unknown: a rule that needs the private audits repo, where there isn't one;
# changed: in diff mode, the changed lines seen by an audit.
[audit]
level = "warn"
grace_days = 7
grace_share = 10
unaudited = "warn"
findings = "warn"
config = "warn"
unknown = "info"

[audit.release]
config = "fail"
release_rules = "fail"
unknown = "warn"

[audit.diff]
changed = "warn"

[audit.release.diff]
changed = "fail"

# Translations: targets is each language's share translated (a code, a group, or "*" for every language); present: in
# diff mode, every new text in every catalog; unused: catalog entries the code no longer uses.
[i18n]
level = "fail"
targets = { "*" = 0 }

[i18n.release]
targets = { "*" = 100 }
unused = "fail"

[i18n.diff]
present = "warn"

# Release checks: each of what has to be true of a release, between releases told (info), at release a check.
# change_notes: a note under notes_dir written since the last release (the release notes are made of them); manual: the
# manual_items ticked on the UI's Gates page for the version.
[release]
level = "info"
version = "info"
translations = "info"
mqtt_settings = "info"
mqtt_docs = "info"
coverage = "info"
audits = "info"
looks = "info"
change_notes = "info"
manual = "info"
notes_dir = "changes"
manual_items = ["Read the release notes through", "Check the README's screenshots still match"]

[release.release]
version = "fail"
translations = "fail"
mqtt_settings = "fail"
mqtt_docs = "fail"
coverage = "fail"
audits = "fail"
looks = "fail"
change_notes = "fail"
manual = "fail"

# Dependencies: behind (new versions upstream), cves (ones to act on); the CVE windows (days); move: which releases
# upkeep moves itself in this checkout (all, minor, none).
[upkeep]
behind = "warn"
cves = "warn"
stale_days = 90
dormant_days = 365
debian_grace_days = 8
review_days = 182
move = "none"

[upkeep.development]
move = "all"

[upkeep.release]
move = "minor"

[upkeep.feature]
move = "none"

# Wardrobe (the style review): looks waiting for approval.
[style]
waiting = "warn"
