[config]
version = 2
read_only = false
version_file = "plexcache/__init__.py"
package = "plexcache"
cache = "plex-cache"

[tags]
release = "v{version}"
freeze = "v{version}-rc.{n}"
preview = "v{version}-beta.{n}"
alpha = "v{version}-alpha.{n}"

[github]
enabled = false

[gate.dev]
branches = ["dev"]
tags = ["alpha"]
github = ["pull_request", "tag"]

[gate.stable]
branches = ["main"]
github = ["pull_request"]

[gate.release]
tags = ["release", "freeze", "preview"]
warn_tags = ["preview"]
github = ["tag"]

[integrations.unit]
title = "Unit Tests"
kind = "tests"
cmd = "python3 tests/run.py --coverage --exclude WebCheckTests --exclude StyleGuideTests --exclude LiveSyncthingTests"

[integrations.future]
title = "Previews"
kind = "previews"
cmd = "callboard tool previews -- python3 dev/future.py --exclude StyleGuideTests"
stop_with = ["unit"]
skip = ["tag"]

[integrations.dhtml]
title = "DHTML"
kind = "checks"
cmd = "callboard tool webcheck"
requires = ["node", "npm"]

[integrations.types]
title = "Code Validation"
letter = "v"
kind = "checks"
cmd = "callboard tool typecheck"

[integrations.build]
title = "Build Validation"
kind = "checks"
cmd = "callboard tool buildcheck"

[integrations.coverage]
title = "Coverage"
kind = "coverage"
cmd = "callboard tool coverage --callboard"
after = ["unit"]

[integrations.audit]
title = "Security Audit"
kind = "audit"
cmd = "callboard tool audit"
requires = ["ghostlight"]
needs = ["ghostlight.toml"]
skip = ["pull_request"]

[integrations.i18n]
title = "Translations"
kind = "i18n"
cmd = "callboard tool i18n --callboard"

[integrations.release]
title = "Release checks"
kind = "release"
cmd = "callboard tool release --callboard"
after = ["unit"]

[integrations.upkeep]
title = "Dependencies"
kind = "upkeep"
cmd = "callboard tool upkeep --callboard"

[integrations.style]
title = "Wardrobe"
kind = "style"
cmd = "callboard tool style check"

[integrations.shared]
title = "Shared Code"
kind = "shared"
cmd = "callboard tool shared"
requires = ["git"]

[unit.dev]
failures = "fail"
warnings = "info"
skipped = "info"

[unit.stable]
warnings = "fail"

[future.dev]
failures = "fail"
warnings = "info"
skipped = "info"

[future.stable]
failures = "off"
warnings = "off"
skipped = "off"

[dhtml]
folders = ["plexcache/web"]
package = "dev"
plan = "python3 tests/webplan.py"
axe = true

[dhtml.dev]
errors = "fail"
warnings = "fail"
information = "info"

[types]
pep8 = true
pep257 = true
pep585 = true
pep621 = true
pep440 = true
pep508 = true
pep723 = true

[types.dev]
errors = "fail"
warnings = "fail"
information = "info"

[build.dev]
errors = "fail"
warnings = "fail"
information = "info"

[coverage]
fresh_days = 14

[coverage.dev]
fresh = "warn"
settled = {warn = 98}
not_measured = "warn"
changed = {warn = 90}

[coverage.release]
every_line = {fail = 98}
each_file = {fail = 90}
changed = "off"

[audit]
grace_days = 7

[audit.dev]
grace_share = {warn = 10}

[audit.release]
grace_share = {fail = 98}
unaudited = "warn"
findings = "warn"
config = "fail"
release_rules = "fail"

[i18n]
leftover_scripts = ["plexcache/web/app.js"]
variants = ["en-US", "en-GB"]

[i18n.dev]
targets = {"*" = 0}
present = "warn"
codes = "fail"

[i18n.stable]
targets = {"*" = 100}
unused = "fail"
plurals = "fail"
quality = "warn"

[i18n.release]
present = "off"

[release]
notes_dir = "changes"
own_checks = ["MQTT settings: python3 dev/mqtt_checks.py settings", "MQTT docs: python3 dev/mqtt_checks.py docs"]
version_also = ["plexcache/tools/rewrite_blocks.py"]
manual_items = ["Read the release notes through", "Check the README's screenshots still match"]

[release.dev]
version = "info"
translations = "info"
own = "info"
coverage = "info"
audits = "info"
looks = "info"
change_notes = "info"
manual = "info"

[release.stable]
version = "fail"
translations = "fail"
own = "fail"
looks = "fail"
change_notes = "fail"
manual = "fail"

[release.release]
coverage = "fail"
audits = "fail"

[upkeep]
stale_days = 90
dormant_days = 365
debian_grace_days = 8
review_days = 182
move = "all"
also = ["MKVToolNix: ARG MKVTOOLNIX from page:https://mkvtoolnix.download/debian/dists/trixie/main/binary-amd64/Packages /^Version: (\\d+(?:\\.\\d+)+)-/; major=0; cve=cpe:bunkus:mkvtoolnix; todo=ARG MKVTOOLNIX in the Dockerfile, once mkvtoolnix.download has the release for the image's Debian.", "ffmpeg: ARG FFMPEG from page:https://ffmpeg.org/releases/ /ffmpeg-(\\d+(?:\\.\\d+)+)\\.tar\\.xz/; built=https://ffmpeg.org/releases/ffmpeg-{version}.tar.xz; sum=FFMPEG_SHA256@https://ffmpeg.org/releases/ffmpeg-{version}.tar.xz; sum=FFMPEG_GH_SHA256@https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n{version}.tar.gz; cve=cpe:ffmpeg:ffmpeg; repo=FFmpeg/FFmpeg; tag=n{version}; todo=ARG FFMPEG in the Dockerfile; the optimizer tests inside the image then say whether the swap checks still pass.", "oxipng: ARG OXIPNG from github:oxipng/oxipng; built=https://github.com/oxipng/oxipng/releases/download/v{version}/oxipng-{version}-x86_64-unknown-linux-gnu.tar.gz; sum=OXIPNG_SHA256_AMD64@https://github.com/oxipng/oxipng/releases/download/v{version}/oxipng-{version}-x86_64-unknown-linux-gnu.tar.gz; sum=OXIPNG_SHA256_ARM64@https://github.com/oxipng/oxipng/releases/download/v{version}/oxipng-{version}-aarch64-unknown-linux-gnu.tar.gz; cve=osv:crates.io:oxipng; todo=ARG OXIPNG in the Dockerfile; CoverArtTests inside the image say whether it still compresses as expected.", "libjpeg-turbo: ARG LIBJPEG_TURBO from github:libjpeg-turbo/libjpeg-turbo; built=https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/{version}/libjpeg-turbo-{version}.tar.gz; sum=LIBJPEG_TURBO_SHA256@https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/{version}/libjpeg-turbo-{version}.tar.gz; cve=cpe:libjpeg-turbo:libjpeg-turbo; tag={version}; todo=ARG LIBJPEG_TURBO in the Dockerfile; CoverArtTests inside the image say whether jpegtran still does.", "Home Assistant (MQTT discovery): plexcache/homeassistant.py /HA_CHECKED = \"([^\"]+)\"/ from pypi:homeassistant; major=0; check=python3 dev/ha_keys.py {version}; todo=Change the discovery messages (plexcache/homeassistant.py: entities and _publish_discovery, and DISCOVERY_KEYS) for that release's MQTT rules (home-assistant.io/integrations/mqtt), then HA_CHECKED."]
images = ["main: ghcr.io/drsassafras/plex-cache:latest", "dev: ghcr.io/drsassafras/plex-cache:dev"]

[upkeep.dev]
behind = "warn"
cves = "warn"
move = "all"

[upkeep.stable]
move = "minor"

[style]
web = "plexcache/web"
stylesheets = ["app.css"]
scripts = ["app.js", "decor.js", "i18n.js", "login.js"]
pages = ["index.html", "login.html"]
not_looks = ["i18n"]
draws = ["decor.js: node dev/decor-draws.js {file}"]
guide = "dev/style-guide.json"
sample = "dev/style-sample"
themes = ["classic/light: Classic light", "classic/dark: Classic dark", "dionysus/light: Dionysus light", "dionysus/dark: Dionysus dark"]
theme_first = "dionysus/light"
theme_file = "plexcache/themes.py"
theme_marks = ["css", "script"]
theme_store = "pc-theme"
theme_urls = ["/theme.css", "/theme.js"]
demo = "python3 tests/demo.py {port}"
demo_env = ["DEMO_SHOWCASE=1"]
before_env = ["DEMO_INLINE_STYLES=1"]
demo_ready = "/api/state"
demo_static = "/static/"
demo_data = "/api/"
demo_tree = ["plexcache", "tests", "dev/cli.py"]
sample_pages = ["health", "tools", "merge", "system"]
page_names = "app.js /(?:var|let|const) PAGES = \\{(.*?)\\};/ /([a-z]+):\\s*page[A-Z]/"
opens = ["info: #infopop opened by .info[data-info] id data-info"]
made_from = ["tests/demo.py", "tests/fakes.py", "tests/fixtures", "dev/decor-draws.js", "dev/package-lock.json"]
packages = "dev"

[style.dev]
waiting = "warn"

[templates.pagechecks.leave_out]
"[data-secret]" = "The Plex, TrueNAS and Syncthing key fields empty themselves once the key is saved, so browser password managers never store it"

[shared.dev]
test_missing = "warn"
test_edited = "fail"
test_behind = "warn"
no_reason = "fail"

[shared.release]
test_missing = "fail"
test_behind = "fail"
