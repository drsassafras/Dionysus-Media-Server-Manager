[config]
version = 2
read_only = false
version_file = "plexcache/__init__.py"
package = "plexcache"
cache = "plex-cache"

[branches]
release = "main"
development = "dev"

[tags]
release = "v{version}"
freeze = "v{version}-rc.{n}"
preview = "v{version}-beta.{n}"
alpha = "v{version}-alpha.{n}"

[github]
enabled = false

[integrations.unit]
title = "Unit Tests"
kind = "tests"
# (LiveSyncthingTests: Previews runs them, against a live Syncthing; here they could only skip)
cmd = "python3 tests/run.py --coverage --exclude WebCheckTests --exclude StyleGuideTests --exclude LiveSyncthingTests"

[integrations.future]
title = "Previews"
kind = "previews"
# callboard's Previews, by this project's own route (the image built on the next Python: dev/future.py)
cmd = "callboard tool previews -- python3 dev/future.py --exclude StyleGuideTests"
stop_with = ["unit"]

[integrations.dhtml]
title = "DHTML"
kind = "checks"
cmd = "callboard tool webcheck"
requires = ["node", "npm"]

[integrations.types]
title = "Code Validation"
letter = "v"
kind = "checks"
cmd = "callboard tool typecheck"

[integrations.build]
title = "Build Validation"
kind = "checks"
cmd = "callboard tool buildcheck"

[integrations.coverage]
title = "Coverage"
kind = "coverage"
cmd = "callboard tool coverage --callboard"
after = ["unit"]

[integrations.audit]
title = "Security Audit"
kind = "audit"
cmd = "python3 dev/audit.py"
needs = ["dev/audit.toml"]

[integrations.i18n]
title = "Translations"
kind = "i18n"
cmd = "python3 dev/i18n.py --callboard"

[integrations.release]
title = "Release checks"
kind = "release"
cmd = "python3 dev/release.py --callboard"
after = ["unit"]

[integrations.upkeep]
title = "Dependencies"
kind = "upkeep"
cmd = "python3 dev/upkeep.py --callboard"

[integrations.style]
title = "Wardrobe"
kind = "style"
cmd = "python3 dev/style.py check"

[unit.push]
failures = "fail"
warnings = "info"
skipped = "info"

[unit.merge]
github = true
failures = "fail"
warnings = "info"
skipped = "info"

[unit.merge.into.main]
warnings = "fail"

[unit.release]
github = true
failures = "fail"
warnings = "fail"
skipped = "info"

[future.push]
failures = "fail"
warnings = "info"
skipped = "info"

[future.merge]
github = true
failures = "fail"
warnings = "info"
skipped = "info"

[future.merge.into.main]
failures = "off"
warnings = "off"
skipped = "off"

[dhtml]
# plexcache/web's CSS, scripts and pages, with dev/package.json's settings and packages (callboard tool webcheck); what
# the app makes, and the pages the accessibility check draws, are tests/webplan.py's to say
folders = ["plexcache/web"]
package = "dev"
plan = "python3 tests/webplan.py"
axe = true

[dhtml.push]
errors = "fail"
warnings = "fail"
information = "info"

[dhtml.merge]
github = true
errors = "fail"
warnings = "fail"
information = "info"

[dhtml.release]
github = true
errors = "fail"
warnings = "fail"
information = "info"

[types]
# The standards Code Validation holds the Python to (callboard/standards.toml): the recommended ones
pep8 = true
pep257 = true
pep585 = true
pep621 = true
pep440 = true
pep508 = true
pep723 = true

[types.push]
errors = "fail"
warnings = "fail"
information = "info"

[types.merge]
github = true
errors = "fail"
warnings = "fail"
information = "info"

[types.release]
github = true
errors = "fail"
warnings = "fail"
information = "info"

[build.push]
errors = "fail"
warnings = "fail"
information = "info"

[build.merge]
github = true
errors = "fail"
warnings = "fail"
information = "info"

[build.release]
github = true
errors = "fail"
warnings = "fail"
information = "info"

[coverage]
fresh_days = 14

[coverage.push]
fresh = "warn"
settled = {warn = 98}
not_measured = "warn"
changed = {warn = 90}

[coverage.merge]
github = true
fresh = "warn"
settled = {warn = 98}
not_measured = "warn"
changed = {warn = 90}

[coverage.release]
github = true
fresh = "warn"
settled = {warn = 98}
not_measured = "warn"
every_line = {fail = 98}
each_file = {fail = 90}

[audit]
grace_days = 7

[audit.push]
grace_share = {warn = 10}
unaudited = "warn"
findings = "warn"
config = "warn"
unknown = "info"
changed = "warn"

[audit.merge]
github = true
grace_share = {warn = 10}
unaudited = "warn"
findings = "warn"
config = "warn"
unknown = "info"
changed = "warn"

[audit.merge.into.main]
config = "fail"
unknown = "warn"
changed = "fail"

[audit.release]
github = true
grace_share = {warn = 10}
unaudited = "warn"
findings = "warn"
config = "fail"
unknown = "warn"
release_rules = "fail"

[i18n.push]
targets = {"*" = 0}
present = "warn"
codes = "fail"

[i18n.merge]
github = true
targets = {"*" = 0}
present = "warn"
codes = "fail"

[i18n.merge.into.main]
targets = {"*" = 100}
unused = "fail"
plurals = "fail"
quality = "warn"

[i18n.release]
github = true
targets = {"*" = 100}
unused = "fail"
plurals = "fail"
quality = "warn"
codes = "fail"

[release]
notes_dir = "changes"
manual_items = ["Read the release notes through", "Check the README's screenshots still match"]

[release.push]
version = "info"
translations = "info"
mqtt_settings = "info"
mqtt_docs = "info"
coverage = "info"
audits = "info"
looks = "info"
change_notes = "info"
manual = "info"

[release.merge]
github = true
version = "info"
translations = "info"
mqtt_settings = "info"
mqtt_docs = "info"
coverage = "info"
audits = "info"
looks = "info"
change_notes = "info"
manual = "info"

[release.merge.into.main]
version = "fail"
translations = "fail"
mqtt_settings = "fail"
mqtt_docs = "fail"
looks = "fail"
change_notes = "fail"
manual = "fail"

[release.release]
github = true
version = "fail"
translations = "fail"
mqtt_settings = "fail"
mqtt_docs = "fail"
coverage = "fail"
audits = "fail"
looks = "fail"
change_notes = "fail"
manual = "fail"

[upkeep]
stale_days = 90
dormant_days = 365
debian_grace_days = 8
review_days = 182
move = "all"

[upkeep.push]
behind = "warn"
cves = "warn"

[upkeep.merge]
github = true
behind = "warn"
cves = "warn"

[upkeep.merge.into.main]
move = "minor"

[upkeep.merge.into.dev]
move = "all"

[upkeep.merge.into."*"]
move = "none"

[upkeep.release]
github = true
move = "minor"
behind = "warn"
cves = "warn"

[style.push]
waiting = "warn"

[style.merge]
github = true
waiting = "warn"

[style.release]
github = true
waiting = "warn"
