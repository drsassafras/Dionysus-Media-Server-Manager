<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security audits</title>
<style>
/*THEME*/
main{max-width:1280px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px}
h1{margin:0;font-size:24px}
.where{color:var(--mute);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 18px}
nav button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);
  padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
.lead{margin:0 0 14px;max-width:80ch;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:0 0 8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-size:22px;line-height:1.2}
.tile span{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 9px;
  border-radius:99px;background:var(--code);color:var(--mute);white-space:nowrap}
.badge.good{background:var(--after-bg);color:var(--after)}
.badge.warn{background:var(--before-bg);color:var(--before)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;list-style:none;margin:0 0 8px;padding:0}
.step{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.step.now{border-color:var(--ink)}
.step .mute{font-size:13px}
.badge.hard{background:var(--line);color:var(--ink)}
.badge.mit{background:transparent;color:var(--ink);border:1px solid var(--ink)}
@media (max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin:0 0 0 6px;padding:0;border-radius:50%;
  border:1px solid var(--mute);background:transparent;color:var(--mute);font:700 11px/1 system-ui,sans-serif;cursor:pointer;flex:none;vertical-align:middle}
.info:hover,.info[aria-expanded=true]{border-color:var(--ink);color:var(--ink)}
#pop{position:absolute;z-index:9;max-width:min(420px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.field{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.field>span:first-child{font-size:13px;color:var(--mute)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:8px 0 10px;font-size:14px}
.facts dt{color:var(--mute);font-size:13px}.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts ul{margin:0;padding-left:18px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
tr.open td{background:var(--code)}
table.findings td:nth-child(4){white-space:nowrap}
td.more{padding:0 8px 12px;background:var(--code)}td.more .card{margin:0}
.who{display:flex;flex-direction:column;gap:8px}
details.override{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin:10px 0 0}
details.override>summary{cursor:pointer;color:var(--mute);font-size:13px}
.offline{border-color:var(--gone);background:var(--gone-bg)}
.badge.bad{background:var(--gone-bg);color:var(--gone)}
code.bad{color:var(--gone);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--code)}
.wrap{overflow-x:auto}
code,.mono{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
ul.plain{margin:0;padding-left:18px}
button.go,button.quiet{font:inherit;font-size:14px;border-radius:8px;padding:6px 14px;cursor:pointer;border:1px solid var(--ink)}
button.go{background:var(--ink);color:var(--card)}
button.quiet{background:var(--card);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  margin:0 0 6px;cursor:pointer;background:var(--card)}
label.opt:has(input:checked){border-color:var(--ink)}
label.opt small{display:block;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.mute{color:var(--mute)}
.log{max-height:420px;overflow:auto;background:var(--code);border-radius:8px;padding:8px 10px}
.log div{padding:2px 0;white-space:pre-wrap;word-break:break-word}
.log .tool{color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--gone-bg);overflow:hidden;min-width:80px;display:flex}
.bar i{display:block;height:100%}
.bar .f{background:var(--after)}.bar .p{background:var(--before)}
.code{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh}
.code div{display:grid;grid-template-columns:4px 52px 1fr;white-space:pre;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.code div span:nth-child(2){color:var(--mute);text-align:right;padding-right:10px;user-select:none}
.code .g{background:transparent}.code .seen-full .g{background:var(--after)}.code .seen-part .g{background:var(--before)}
.code .unseen .g{background:var(--gone)}
.empty{color:var(--mute);font-style:italic}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
h3.group{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.cvss{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px;margin:8px 0}
.cvss label{display:flex;flex-direction:column;gap:2px}.cvss code{word-break:break-all}.cvss small{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<main>
<header><h1>Security audits</h1><span class="where" id="where"></span></header>
<nav id="tabs"></nav>
<section id="view"></section>
</main>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const TABS = [["overview", "Overview"], ["start", "Start audit"], ["runs", "Runs"], ["findings", "Findings"],
  ["explorer", "Explorer"], ["rules", "Rules"]];
let tab = "overview", timer = 0, opts = null, checkedAt = 0;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;   // (not a style attribute: the page's CSP allows only its own <style>)
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
// an ⓘ: what a setting or a word means, shown when it's clicked (one at a time), not said inline
function info(text, about) {
  const b = h("button", {type: "button", class: "info", "aria-label": "About " + (about || "this"), "aria-expanded": "false", "data-info": text}, "i");
  b.addEventListener("click", e => { e.stopPropagation(); popInfo(b); });
  return b;
}
function popInfo(b) {
  const was = document.getElementById("pop"), same = was && was.dataset.for === b.dataset.info;
  closePop();
  if (same) return;
  const r = b.getBoundingClientRect(), pop = h("div", {id: "pop", role: "tooltip", "data-for": b.dataset.info}, b.dataset.info);
  document.body.append(pop);
  pop.style.top = (window.scrollY + r.bottom + 6) + "px";
  pop.style.left = Math.max(16, Math.min(window.scrollX + r.left - 8, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 16)) + "px";
  b.setAttribute("aria-expanded", "true");
}
function closePop() {
  const p = document.getElementById("pop");
  if (p) p.remove();
  for (const x of document.querySelectorAll(".info[aria-expanded=true]")) x.setAttribute("aria-expanded", "false");
}
document.addEventListener("click", e => { if (!e.target.closest("#pop")) closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
// a setting: its name, its ⓘ, and the control
const field = (label, control, about) => h("label", {class: "field"}, h("span", {}, label), info(about, label), control);
// a row of buttons, one pressed: a filter
function seg(choices, now, set) {
  return h("div", {class: "seg", role: "group"}, choices.map(([v, label]) => h("button", {type: "button", "aria-pressed": String(v === now), onclick: () => set(v)}, label)));
}
// what each AI auditor's plugin picks until you pick another (its default: a model and an effort)
const preferred = p => (p.default || {}).auditor || p.auditors[0];
const effortOf = p => String((p.default || {}).thoroughness || Object.keys(p.efforts)[0] || "");
function put(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false)); }
const GONE_SAID = "Lost the page's server. Reconnecting… If it doesn't come back within a minute, start it again with python3 dev/audit.py gui (or a on callboard's board): this tab picks it up by itself.";
let stale = null;   // (the server runs older code than is on disk: a banner says to start it again)
function old() {
  if (stale) return;
  stale = h("div", {class: "card offline", role: "alert"}, h("b", {}, "This page is out of date. "),
    "Its server started before its code last changed, so it can show things wrongly. Close this tab and start it again with python3 dev/audit.py gui.");
  document.querySelector("main, body").prepend(stale);
}
let offline = null;   // (the server's gone: a banner says so, and it's asked again every few seconds until it's back)
function lost() {
  if (offline) return;
  offline = h("div", {class: "card offline", role: "alert"}, h("b", {}, "Not connected. "), GONE_SAID.replace(/^Lost the page's server\. /, ""));
  document.querySelector("main, body").prepend(offline);
  const again = async () => {
    try {
      const r = await fetch("/api/stamp", {headers: {"X-Page-Token": TOKEN}});
      if (r.ok) { offline.remove(); offline = null; flash = "Reconnected."; show(tab); return; }
    } catch (e) { /* (still gone) */ }
    setTimeout(again, 3000);
  };
  setTimeout(again, 3000);
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers: {"X-Page-Token": TOKEN}} :
    {method: "POST", headers: {"X-Page-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)}).catch(() => { lost(); throw new Error("not connected to the page's server (see the top of the page)."); });
  const got = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(got.error || r.statusText);
  return got;
}
const pct = (n, of) => (of ? (100 * n / of).toFixed(1) : "100.0") + "%";
const when = t => t ? new Date(t * 1000).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "";
const took = (a, b) => { const s = Math.max(0, Math.round((b || Date.now() / 1000) - a)); return s < 60 ? s + " s" : Math.round(s / 60) + " min"; };
const STATE = {done: "good", open: "warn", running: "warn", preparing: "warn", failed: "bad", cancelled: "", interrupted: "bad"};
const SEV = {critical: "bad", high: "bad", medium: "warn", low: "", info: ""};
const unpushed = f => (f.status === "fixed" || f.status === "mitigated") && (f.fix === "working copy" || f.fix === "committed" || (!f.fixed_in && f.fix !== "pushed"));
// (each finding's one state, where it is in audit, fix, report, confirm, push: [section, label, badge, what it means])
const stateOf = f => f.status !== "open" ? (unpushed(f) ? ["push", f.status + ", not pushed yet", "warn", "Its " + (f.status === "mitigated" ? "mitigation" : "fix") + " isn't pushed yet"]
    : f.status === "mitigated" ? ["mitigated", "mitigated", "mit", "Lived with for now, kept for a proper fix later"]
    : ["closed", f.status === "fixed" ? "closed: fixed" : f.status, "good", "Nothing left to do"])
  : f.waiting ? ["confirm", f.reported + ", to confirm", "warn", "Reported " + f.reported + ": Confirm now runs its tests"]
  : f.worked ? ["worked", "worked on, not reported", "warn", "Its code has changed, but no fix was reported"]
  : f.reported ? ["open", f.reported === "not-real" ? "said not real" : "fix tried, still open", "warn", "Reported " + f.reported + " by whoever fixed it"]
  : ["open", "open", "bad", "Not fixed yet"];
const REPORT_HOW = "Report the security fixes you made: run `python3 dev/audit.py fixes` and report each one as it says, with `python3 dev/audit.py fixed`.";
const FIX = {"working copy": "The fix is only in your working copy: commit and push it.", committed: "The fix is committed, not pushed yet.",
  pushed: "The fix is pushed.", "not fixed": "Its code is as it was: the fix is somewhere else, or it isn't fixed yet."};
async function copyText(text, btn) {
  const was = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) { const t = h("input", {type: "text", value: text, class: "mono", size: 60}); btn.after(t); t.select(); btn.textContent = "Select and copy"; }
  setTimeout(() => { btn.textContent = was; }, 2500);
}
let flash = "", stamp = "";   // (what the last button did, said at the top once; the records as last shown)
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

const openKey = d => ((d.closest("[data-key]") || {dataset: {}}).dataset.key || "") + "|" + (d.querySelector("summary") || {textContent: ""}).textContent.replace(/\s*\(\d+\)/, "");
// Each tab, once drawn, is kept: going back to it shows it at once, where you were, and it's drawn again out of sight and
// put in place when that's done (a form, Start audit or Rules, is kept as you left it). The other tabs are drawn in the
// background after the first, so the first visit to each is quick too.
const RENDER = () => ({overview, start, runs, findings, explorer, rules});
const KEEP_AS_LEFT = new Set(["start", "rules"]);
const panes = {}, gens = {}, scrolls = {};
function pane(name) {
  if (!panes[name]) panes[name] = document.getElementById("view").appendChild(h("div", {hidden: true, "data-pane": name}));
  return panes[name];
}
function show(name) {
  const again = name === tab;
  if (!again) scrolls[tab] = window.scrollY;
  tab = name; clearTimeout(timer); closePop();
  const nav = document.getElementById("tabs"); put(nav);
  for (const [id, label] of TABS) nav.append(h("button", {"aria-selected": String(id === name), onclick: () => show(id)}, label));
  for (const [n, el] of Object.entries(panes)) el.hidden = n !== name;
  const p = pane(name), drawn = p.childElementCount > 0 && !p.querySelector("[data-loading]");
  p.hidden = false;
  if (!again) window.scrollTo(0, drawn ? scrolls[name] || 0 : 0);
  if (!again && drawn && KEEP_AS_LEFT.has(name) && !pending) return Promise.resolve();
  return draw(name);
}
function draw(name) {
  const g = gens[name] = (gens[name] || 0) + 1, p = pane(name);
  const slot = h("div", {hidden: true});   // (first in the page: its ids are the ones found while it's drawn)
  document.getElementById("view").prepend(slot);
  const wait = p.childElementCount ? 0 : setTimeout(() => { if (g === gens[name] && !p.childElementCount) put(p, h("p", {class: "empty", "data-loading": "1"}, "Loading…")); }, 250);
  const done = () => {
    clearTimeout(wait);
    if (g !== gens[name]) { slot.remove(); return; }
    const y = window.scrollY, was = [...p.querySelectorAll("details")];
    const open = new Set(was.filter(d => d.open).map(openKey)), shut = new Set(was.filter(d => !d.open).map(openKey));
    p.replaceChildren(...slot.childNodes);
    slot.remove();
    for (const d of p.querySelectorAll("details")) { const k = openKey(d); if (open.has(k)) d.open = true; else if (shut.has(k)) d.open = false; }
    if (tab === name) window.scrollTo(0, y);
  };
  return RENDER()[name](slot).then(done, e => { put(slot, h("p", {class: "empty"}, "Couldn't load it: " + e.message)); done(); });
}
async function preload() {   // (the tabs not drawn yet, one at a time, while you read the first)
  for (const [id] of TABS) if (!panes[id] || !panes[id].childElementCount) { pane(id); await draw(id).catch(() => {}); }
}

// ---------------------------------------------------------------- Overview
async function overview(view) {
  const o = await api("/api/overview");
  document.getElementById("where").textContent = o.private ? "with the private records" : "public records only";
  const tiles = h("div", {class: "tiles"},
    o.open != null ? h("div", {class: "tile"}, h("b", {}, o.open), h("span", {}, o.open === 1 ? "open finding" : "open findings")) : null,
    h("div", {class: "tile"}, h("b", {}, pct(o.seen, o.lines)), h("span", {}, "audited")),
    h("div", {class: "tile"}, h("b", {}, pct(o.full, o.lines)), h("span", {}, "by a full audit")),
    h("div", {class: "tile"}, h("b", {}, o.lines - o.seen), h("span", {}, "lines no audit has seen")),
    h("div", {class: "tile"}, h("b", {}, o.push), h("span", {}, "to audit before a push")),
    h("div", {class: "tile"}, h("b", {}, o.audits), h("span", {}, o.last ? "audits, the last " + o.last : "audits yet")));
  const checks = o.checks.map(c => h("div", {class: "card"},
    h("div", {class: "row"}, h("b", {}, c.tool), h("span", {class: "badge " + (c.bad ? "warn" : "good")}, c.bad ? "to do" : "fine"),
      h("span", {class: "mute"}, c.facts.join(" · "))),
    c.findings.length ? h("ul", {class: "plain"}, c.findings.slice(0, 12).map(f =>
      h("li", {}, f.path && f.path !== "app code" ? h("code", {}, f.path) : null, f.path && f.path !== "app code" ? " " : null, f.message))) : null));
  const commit = h("div", {class: "card"}, h("b", {}, "Waiting for you to commit"),
    !o.commit.app.length && !o.commit.private.length ? h("p", {class: "empty"}, "Nothing: every audit record is committed.") :
      h("div", {class: "grid2"},
        h("div", {}, h("p", {class: "note"}, "This repo (security/audits/)"), h("ul", {class: "plain mono"}, o.commit.app.map(p => h("li", {}, p)))),
        h("div", {}, h("p", {class: "note"}, "The private audits repo"), h("ul", {class: "plain mono"}, o.commit.private.map(p => h("li", {}, p))))),
    h("p", {class: "note"}, "Nothing here is ever committed for you."));
  put(view, tiles,
    o.push ? h("p", {class: "lead"}, plural(o.push, "line") + " no audit has seen aren't pushed yet. ",
      h("button", {class: "quiet", onclick: () => { pending = "unpushed"; show("start"); }}, "Audit them")) : null,
    (o.scorecard || []).length ? h("div", {class: "card"}, h("b", {}, "Who found what, and what they missed"),
      h("div", {class: "wrap"}, h("table", {}, h("tr", {}, ["Auditor", "Thoroughness", "Prompt", "Audits", "Found", "Missed"].map(t => h("th", {}, t))),
        o.scorecard.map(r => h("tr", {},
          h("td", {}, String(r.auditor || "").replace(/^human:/, "") + (r.author ? " (the author's own)" : "")), h("td", {}, String(r.thoroughness)),
          h("td", {}, r.prompt), h("td", {}, String(r.audits.length)), h("td", {title: r.found.join(", ")}, String(r.found.length)),
          h("td", {title: r.missed.join(", "), class: r.missed.length ? "bad" : ""}, r.missed.length ? r.missed.length + " (" + r.missed.join(", ") + ")" : "0"))))),
      h("p", {class: "note"}, "Missed: it read a finding's lines, and a later audit or a fix's test found it. Findings a fix's test found count for no auditor.")) : null,
    h("h2", {}, "Checks"), checks, commit,
    o.problems.length ? h("div", {class: "card"}, h("b", {}, "Notes"), h("ul", {class: "plain"}, o.problems.map(p => h("li", {}, p)))) : null);
}

// ---------------------------------------------------------------- Start audit
let pending = "";
const SEVERITIES = ["critical", "high", "medium", "low", "info"], MAINS = ["affected", "not-affected", "fixed"];
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* (not kept: fine) */ } }};
let marking = null;   // (the findings of a review being marked as audited, before it's recorded)
async function start(view) {
  opts = opts || await api("/api/options");
  marking = null;
  const form = h("div", {class: "grid2"});
  const targets = h("div", {}, h("h2", {}, "What to audit", info("Which code this audit reads. A full audit reads all the app code; the rest are partial. What counts as app code is dev/audit.toml's.", "what to audit")));
  const want = pending || "uncommitted"; pending = "";
  const groups = [["New and changed code", ["uncommitted", "unpushed", "since-audit", "branch"]], ["The whole app", ["full", "unaudited"]],
    ["Your choice", ["chosen"]]].concat(want === "open" || want === "open-changed" ? [["Findings: are they fixed?", [want]]] : []);   // (checking the fixes starts on Findings)
  const hint = {open: "Each open finding is looked for again: in your working copy, the branch as pushed, and main. (From Findings: Have an AI check the fixes.)",
    "open-changed": "The same, and a new audit of what's changed since the last one, in one go."};
  for (const [title, ids] of groups) {
    const here = ids.filter(id => opts.targets[id]);
    if (!here.length) continue;
    targets.append(h("h3", {class: "group"}, title));
