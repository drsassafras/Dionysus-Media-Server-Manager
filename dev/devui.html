// ---------------------------------------------------------------- talking to the server
async function api(path, body) {

  } catch (e) { e.gone = true; throw e; }   // (no answer at all: the server's away, not a word from it)
  const got = await r.json().catch(() => ({}));

}

function ico(id) {

  svg.innerHTML = ICONS[id] || ICONS.block;

}

}
// ---------------------------------------------------------------- Connected to: where devtools pushes, and how it stands

// Beside Restart: how the checks stand, in a line — the blocks that failed, warned and passed (as the board has them), and
