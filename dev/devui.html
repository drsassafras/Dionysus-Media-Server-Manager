}

}

  return el;
}

}

}

function busy() { return VIEW && VIEW.job && VIEW.job.running; }

function ico(id) {

}

        h("td", {class: "mono"}, r.commit), ...ids.map(i => h("td", {class: "c"}, r.blocks[i] ? h("span", {class: "dot " + (DOTS[r.blocks[i]] || "wait"), title: r.blocks[i]}) : "")),
        h("td", {class: "nw"}, r.started ? took(r.started, r.ended) : ""))))))
  );
}

// ---------------------------------------------------------------- moving about
function go(where) { WHERE = where; location.hash = where; render(); document.getElementById("main").focus({preventScroll: true}); }
addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || /^(input|textarea|select)$/i.test(e.target.tagName)) return;
  if (e.key === "u") go("hub");
  else if (VIEW) { const b = VIEW.blocks.find(x => x.page === e.key); if (b) go(b.id); }
});
async function poll() {
  try {
    VIEW = await api("/api/run");
    if (WAS_BUSY && !busy()) STATUS = {};   // (a push or restart from here just ended: the NAS asked again)
    WAS_BUSY = !!busy();
    if (VIEW.wanted) go(VIEW.wanted === "hub" ? "hub" : VIEW.wanted);
    else render();
  } catch (e) { /* (the server's gone: the page stays as it was) */ }
}
function pickers() {
  const info = {classic: "Classic", dionysus: "Dionysus"}, own = window.PCTHEME.own() || {};
  const now = {theme: own.theme || document.documentElement.getAttribute("data-theme"), mode: own.mode || "auto"};   // (the app's default until a choice is made here)
  const seg = (id, choices, key) => {
    const el = document.getElementById(id);
    el.replaceChildren(...Object.entries(choices).map(([v, label]) => h("button", {role: "tab", "aria-selected": String(now[key] === v),
      onclick: () => { window.PCTHEME.setOwn(Object.assign({}, now, window.PCTHEME.own() || {}, {[key]: v})); pickers(); }}, label)));
  };
  seg("themepick", info, "theme"); seg("modepick", {auto: "Auto", light: "Light", dark: "Dark"}, "mode");
}
WHERE = (location.hash || "#hub").slice(1) || "hub";
pickers();
poll();
TIMER = setInterval(poll, 1000);
/*BEAT*/
</script>
