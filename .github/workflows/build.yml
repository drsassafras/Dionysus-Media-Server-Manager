name: Test and publish image

# (A release tag is .github/workflows/publish.yml's: the release gate, the image at its version, the GitHub Release.)
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"  # weekly: the image built again on the release branch, so it carries the newest Python 3.15.x and Debian packages
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write       # (the attestation's signature: the workflow's own identity)
  attestations: write   # (kept in the repository's attestations, where Update Now looks)

jobs:
  test:
    # The Python the image runs — 3.15, its newest patch release — with every deprecation an error, so what a later Python
    # removes shows up here first. The next Python is tried locally, not here: dev/future.py (dev/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # the dev tools (their own project: github.com/drsassafras/callboard), fetched beside the code and named to it
      # (CALLBOARD_HOME: dev/__init__.py finds the install by that; its bin on the PATH, for `callboard gate`, `callboard tool`)
      - name: The dev tools
        env:
          CALLBOARD_REF: main
        run: |
          git clone --quiet --depth 1 --branch "$CALLBOARD_REF" https://github.com/drsassafras/callboard "$RUNNER_TEMP/callboard"
          echo "CALLBOARD_HOME=$RUNNER_TEMP/callboard" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/callboard/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"
      # what checks and builds the web app's CSS, scripts and pages (dev/web.js: Stylelint, ESLint, TypeScript, html-validate, axe-core, postcss-preset-env, Autoprefixer,
      # cssnano, Terser, html-minifier-terser), for the suite's WebBuildTests
      - run: npm ci --prefix dev --no-audit --no-fund
      # the browser the accessibility check draws the pages in (dev/web.js a11y: axe-core, through Playwright at
      # dev/package.json's version), with the libraries it needs
      - run: npx --prefix dev playwright install --with-deps chromium
      # the suite (tests/run.py: its classes shared out among workers), but for the style guide, a step of its own
      - name: Tests
        run: python -W error::DeprecationWarning -W error::PendingDeprecationWarning tests/run.py --exclude StyleGuideTests
      # every look the app wears approved by the maintainer (dev/style.py, dev/style-guide.json): a failure here is a look
      # waiting for their OK (python3 dev/style.py sample, then they approve), not a broken test
      - name: Style guide
        if: ${{ !cancelled() }}   # (its answer either way, whatever the tests did)
        run: python -W error::DeprecationWarning -W error::PendingDeprecationWarning -m unittest tests.test_plexcache.StyleGuideTests -v
      # the Python validation (callboard tool typecheck), as callboard's Python Validation block runs it: the type check
      # (pyrightconfig.json: an error is a fault — an undefined name, a variable read before it's set — a warning an
      # annotation that says less than the code does) and Ruff's lint (ruff.toml: unused imports, likely bugs, the import
      # order, security…), each at zero and kept there; Ruff's findings are annotated on their lines
      - name: Python validation
        if: ${{ !cancelled() }}
        run: callboard tool typecheck   # (each tool at its version in dev/tools.toml, moved by dev/upkeep.py)
      # the build validation (callboard tool buildcheck), as callboard's Build Validation block runs it: ShellCheck on the shell scripts,
      # actionlint on these workflows (and ShellCheck on each step's script), hadolint on the Dockerfile; kept at zero
      - name: Build validation
        if: ${{ !cancelled() }}
        run: callboard tool buildcheck

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: The dev tools   # (as the first job has them)
        env:
          CALLBOARD_REF: main
        run: |
          git clone --quiet --depth 1 --branch "$CALLBOARD_REF" https://github.com/drsassafras/callboard "$RUNNER_TEMP/callboard"
          echo "CALLBOARD_HOME=$RUNNER_TEMP/callboard" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/callboard/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plex-cache
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short
      # Built first without pushing, so the optimizer's tests can run inside it: with the image's own
      # MKVToolNix, ffmpeg, oxipng and jpegtran (the runner has none of them, so there they're skipped).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plex-cache:test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLEXCACHE_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || 'stable' }}
            PLEXCACHE_COMMIT=${{ github.sha }}
          pull: true  # (the pinned digest of python:3.15-slim-trixie fetched afresh, not a cached one; upkeep moves the digest to the tag's newest)
      - name: The image's Python has what the code needs (ZSTD, for the block estimates)
        run: docker run --rm --entrypoint python plex-cache:test -c "import compression.zstd as z; print('zstd', z.zstd_version)"
      - name: What this image carries (dev/README.md, Python and the other dependencies)
        run: docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python plex-cache:test dev/versions.py
      - name: Optimizer tests inside the image
        run: >
          docker run --rm -v "$PWD:/src:ro" -v "$CALLBOARD_HOME:/callboard:ro" -e CALLBOARD_HOME=/callboard -w /src
          --entrypoint python plex-cache:test
          -W ignore -m unittest -v tests.test_plexcache.FixtureTests tests.test_plexcache.OptimizerTests
          tests.test_plexcache.CoverArtTests
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"
      # the CVEs to act on (dev/cves.py, as callboard's Dependencies block says them): in this image (Trivy), the
      # web's npm packages (OSV) and the tools the image is built with (NVD). Each one a warning on the run, never a
      # failure: what someone else is already fixing isn't said
      - name: CVEs to act on
        if: ${{ !cancelled() }}
        continue-on-error: true   # (whatever happens here, the image is still pushed)
        run: python dev/upkeep.py --cves plex-cache:test
      - name: Push
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag plex-cache:test "$tag"
            docker push "$tag"
          done
          # the digest every tag now points at: what the attestation below vouches for, and what Update Now checks
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' plex-cache:test | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # This build's provenance, signed with the workflow's own identity and kept in the repository's attestations: an app
      # pressing Update Now pulls only an image attested here (plexcache/updates.py verify_image, F-2026-043)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/plex-cache
          subject-digest: ${{ steps.push.outputs.digest }}
